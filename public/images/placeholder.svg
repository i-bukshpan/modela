<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <g transform="translate(300, 180) scale(1.5)">
    <!-- A 3D cube isometric view -->
    <path d="M 0 -30 L 26 -15 L 0 0 L -26 -15 Z" fill="#FCD34D" opacity="0.9"/>
    <path d="M -26 -15 L 0 0 L 0 30 L -26 15 Z" fill="#F59E0B" opacity="0.8"/>
    <path d="M 0 0 L 26 -15 L 26 15 L 0 30 Z" fill="#B45309" opacity="0.9"/>
    
    <!-- Wireframe overlay -->
    <path d="M 0 -30 L 26 -15 L 26 15 L 0 30 L -26 15 L -26 -15 Z" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -26 -15 L 0 0 L 26 -15 M 0 0 L 0 30" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  
  <text x="300" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="2">MODELA</text>
  <text x="300" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">3D PRINTING STUDIO</text>
</svg>
